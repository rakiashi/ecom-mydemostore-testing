name: Snapshot Tests

on:
  workflow_dispatch:

jobs:
  snapshot:
    # Existing reviewed baselines use Playwright's darwin suffix.
    runs-on: macos-latest

    env:
      HEADLESS: true
      PLATFORM_BROWSER_NAMES: desktop-chromium

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run snapshot tests
        run: npm run test:snapshot

      - name: Upload snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
