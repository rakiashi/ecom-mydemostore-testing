name: Full Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest

    env:
      HEADLESS: true
      PLATFORM_BROWSER_NAMES: desktop-chromium,desktop-firefox,desktop-webkit
      SLACK_NOTIFY: ${{ vars.SLACK_NOTIFY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Type-check tests
        run: npm run typecheck

      - name: Run API smoke tests
        run: npm run test:api

      - name: Run cross-browser regression tests
        id: regression
        run: npm run test:regression
        continue-on-error: true

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Generate Test Summary
        id: summary
        run: |
          node -e '
            const fs = require("fs");
            const report = require("./test-results/report.json");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `PASSED=${report.summary.passed.value}\nFAILED=${report.summary.failed.value}\n`,
            );
          '

      - name: Slack Notification
        if: env.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "*Full Regression Test Result*\n
              ✅ Passed: ${{ steps.summary.outputs.PASSED }}\n
              ❌ Failed: ${{ steps.summary.outputs.FAILED }}\n
              🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Fail Workflow If Tests Failed
        if: steps.regression.outcome == 'failure'
        run: exit 1
